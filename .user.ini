upload_max_filesize = 50M
post_max_size = 55M
max_execution_time = 300
max_input_time = 300

; ---------------------------------------------------------------------------
; Error output hardening
; ---------------------------------------------------------------------------
; Without these, guest pages inherit whatever the host's default is. Only a
; handful of admin/API files set display_errors for themselves, so a PHP notice
; or warning on a public page could render a file path or query fragment into
; the response. Log everything, show nothing.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Keep the session cookie off JavaScript and out of cross-site requests.
; (No PHP code sets session cookie params, so these are the only source.)
; session.cookie_secure is deliberately NOT set here — .htaccess already forces
; HTTPS, and hard-setting it would break sessions on any plain-HTTP local copy.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; NOTE: expose_php cannot be set from .user.ini — it is PHP_INI_SYSTEM, so it is
; only changeable in php.ini / the cPanel MultiPHP INI Editor. Left out rather
; than written here, where it would silently do nothing. Turn it off server-side
; to stop advertising the PHP version in response headers.
